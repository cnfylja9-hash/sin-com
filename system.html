<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S I N . c o m // ACCESS_GRANTED</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        .access-container {
            text-align: center;
            border: 2px solid #00ff00;
            padding: 40px 60px;
            background: #050a05;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.2);
        }
        h1 {
            color: #00ff00;
            font-size: 32px;
            letter-spacing: 6px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ff00;
        }
        p {
            color: #889988;
            font-size: 14px;
            letter-spacing: 2px;
        }
        .back-btn {
            margin-top: 30px;
            background: transparent;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 30px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: #00ff00;
            color: #000000;
            box-shadow: 0 0 20px #00ff00;
        }
    </style>
</head>
<body>

    <div class="access-container">
        <h1>ACCESS GRANTED</h1>
        <p>ДОБРО ПОЖАЛОВАТЬ В СИСТЕМУ</p>
        <button class="back-btn" onclick="window.location.href='index.html'">ВЫХОД</button>
    </div>

</body>
